name: build_and_publish

# The build runs in `secret-free` and reads no credentials. The deploy job reads
# the Cloudflare and Algolia credentials from the `deploy` environment. Cloudflare
# Pages serves `trunk` as production and every other branch as a preview. A secret
# read outside its environment is empty, so the deploy job fails when its secrets
# are missing instead of skipping.

on:
  push:
    branches:
      - trunk
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs for the same ref deploy one at a time, and pull request runs cancel
# superseded runs. The deploy job also skips a trunk run whose commit is no
# longer the head of trunk, because GitHub does not guarantee run order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    environment: secret-free
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload website build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-build
          path: website/build
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: build
    # Pull requests from forks and Dependabot receive no environment secrets, so they build only.
    if: >-
      ${{ github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    environment: deploy
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      IS_TRUNK: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/trunk' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download website build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: website-build
          path: website/build

      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALGOLIA_CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
          ALGOLIA_USER_ID: ${{ secrets.ALGOLIA_USER_ID }}
          ALGOLIA_TOKEN: ${{ secrets.ALGOLIA_TOKEN }}
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)
          if [[ "$IS_TRUNK" == "true" ]]; then
            required+=(ALGOLIA_CRAWLER_ID ALGOLIA_USER_ID ALGOLIA_TOKEN)
          fi
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::The deploy environment is missing: ${missing[*]}"
            exit 1
          fi

      - name: Check trunk head
        id: head
        if: ${{ env.IS_TRUNK == 'true' }}
        run: |
          head=$(git ls-remote origin refs/heads/trunk | cut -f1)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::notice::trunk is at $head, so this run for $GITHUB_SHA does not deploy."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: ${{ steps.head.outputs.stale != 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: website
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=spiceai-org-website --branch ${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Add deploy comment to PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 deployed to <${{ steps.deploy.outputs.deployment-url }}>'
            })

      - name: Trigger search reindex after deployment
        if: ${{ env.IS_TRUNK == 'true' && steps.head.outputs.stale != 'true' }}
        run: |
          curl --fail-with-body -X POST "https://crawler.algolia.com/api/1/crawlers/${{ secrets.ALGOLIA_CRAWLER_ID }}/reindex" \
            --user "${{ secrets.ALGOLIA_USER_ID }}":"${{ secrets.ALGOLIA_TOKEN }}"
