name: build

# Cloudflare Pages builds and deploys the site through its GitHub integration.
# This workflow only builds pull requests, including those from forks, which
# Cloudflare does not build. The build fails on broken links.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: secret-free
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: website/.nvmrc

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Build website
        working-directory: website
        run: npm run build
