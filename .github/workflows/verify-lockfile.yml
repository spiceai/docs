# Fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream.
#
# After adding a workflow or changing any `uses:`, regenerate the lockfile:
#   gh extension install github/gh-actions-lock
#   gh actions-lock
# See https://github.com/github/gh-actions-lock

name: verify-lockfile

on:
  pull_request:
  merge_group:
  push:
    branches:
      - trunk

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download the gh-actions-lock verifier and check its digest
        env:
          VERIFIER_VERSION: v0.4.1
          VERIFIER_SHA256: 39deb2fe714dbf74b073d8245fc7f3d50cd0eee18d5c0900e9e849ae933ae17e
        run: |
          gh release download "$VERIFIER_VERSION" --repo github/gh-actions-lock --pattern linux-amd64 --output "$RUNNER_TEMP/gh-actions-lock" --clobber
          echo "$VERIFIER_SHA256  $RUNNER_TEMP/gh-actions-lock" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/gh-actions-lock"
      - run: '"$RUNNER_TEMP/gh-actions-lock" --verify'
