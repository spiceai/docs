[package]
name = "release_download_integrity"
version = "2.4.3"
edition = "2021"
publish = false

# The library under test is the Spice CLI release-download code from spiceai
# tag v2.4.3 (commit 40af136fc6989bf19a685cb58d6a08e5509e903b), copied verbatim
# into src/github. `spice install`, `spice upgrade`, and `spice run` all reach
# that code before they extract or start a release binary.

[dependencies]
flate2 = "1"
futures = "0.3"
reqwest = { version = "0.13", features = ["stream", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
tar = "0.4"
tempfile = "3"
tracing = "0.1"
urlencoding = "2"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "process", "time"] }
